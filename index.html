<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <title>Daymark — To-do list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f7f2;
      --surface: #fff;
      --ink: #1d2923;
      --muted: #7c857f;
      --line: #e7e9e2;
      --green: #28684f;
      --green-soft: #e8f1eb;
      --lime: #d8ed78;
      --coral: #d97861;
      --blue: #6e91aa;
      --shadow: 0 16px 45px rgb(34 48 39 / 7%);
      font-family: "DM Sans", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#dfe4da 0.65px, transparent 0.65px);
      background-size: 18px 18px;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1160px, 100%); min-height: 100vh; margin: 0 auto; padding: 34px 42px; }
    .topbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 24px; align-items: center; margin-bottom: 48px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 700; letter-spacing: .02em; }
    .brand-mark { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 9px; background: var(--green); color: #fff; }
    .brand-mark svg { width: 17px; height: 17px; }
    .today-label { color: var(--muted); font-size: 13px; font-weight: 500; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }
    .nav { display: flex; min-width: 0; justify-content: center; gap: 4px; padding: 4px; border: 1px solid #dce8df; border-radius: 10px; background: var(--green-soft); }
    .nav button { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; color: #4f6758; white-space: nowrap; cursor: pointer; transition: background .18s, color .18s, box-shadow .18s; }
    .nav button:hover { background: #dce9df; color: var(--ink); }
    .nav button.active { background: var(--green); color: #fff; font-weight: 600; box-shadow: 0 2px 6px rgb(29 87 63 / 18%); }
    .nav-icon { display: grid; width: 18px; height: 18px; place-items: center; }
    .nav-icon svg { width: 17px; height: 17px; stroke-width: 1.8; }
    .nav-count { color: #718578; font-size: 12px; }
    .nav button.active .nav-count { color: #e3efe7; }
    main { min-width: 0; }
    .heading-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 27px; }
    h1 { margin: 0; font-family: "Fraunces", Georgia, serif; font-size: clamp(34px, 4vw, 45px); font-weight: 500; letter-spacing: 0; line-height: 1.08; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
    .progress { display: flex; align-items: center; gap: 10px; padding-bottom: 3px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .progress-track { width: 68px; height: 5px; overflow: hidden; border-radius: 5px; background: #e5e8e0; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--green); transition: width .25s ease; }
    .composer { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 9px; margin-bottom: 27px; padding: 9px; border: 1px solid #e6e9e1; border-radius: 9px; background: var(--surface); box-shadow: 0 5px 18px rgb(34 48 39 / 3%); }
    .composer input[type="text"] { width: 100%; min-width: 0; padding: 0 10px; border: 0; outline: 0; color: var(--ink); font-size: 14px; }
    .composer input::placeholder { color: #a1a9a2; }
    .composer select, .composer input[type="date"] { min-height: 38px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: #68736c; font-size: 12px; }
    .add-button { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; border: 0; border-radius: 6px; background: var(--green); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .18s, transform .18s; }
    .add-button:hover { transform: translateY(-1px); background: #1d573f; }
    .add-button svg { width: 15px; height: 15px; }
    .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .list-head h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .sort-label { color: #99a19b; font-size: 11px; }
    .task-list { display: grid; gap: 8px; }
    .task { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 32px; gap: 13px; align-items: center; min-height: 66px; padding: 12px 12px 12px 16px; border: 1px solid #e8eae4; border-radius: 7px; background: var(--surface); box-shadow: 0 3px 12px rgb(34 48 39 / 2%); animation: arrive .24s ease both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .check { position: relative; width: 19px; height: 19px; margin: 0; appearance: none; border: 1.5px solid #cbd2cb; border-radius: 50%; cursor: pointer; transition: background .15s, border-color .15s; }
    .check:hover { border-color: var(--green); }
    .check:checked { border-color: var(--green); background: var(--green); }
    .check:checked::after { position: absolute; top: 2px; left: 5px; width: 5px; height: 9px; transform: rotate(45deg); border: solid #fff; border-width: 0 1.5px 1.5px 0; content: ""; }
    .task-copy { min-width: 0; }
    .task-title { overflow-wrap: anywhere; font-size: 13px; font-weight: 500; line-height: 1.4; }
    .task-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; color: var(--muted); font-size: 10px; }
    .priority { display: inline-flex; align-items: center; gap: 5px; }
    .priority::before { width: 6px; height: 6px; border-radius: 50%; background: #aab2ab; content: ""; }
    .priority.high::before { background: var(--coral); }
    .priority.medium::before { background: #d0a44e; }
    .due { white-space: nowrap; }
    .due.overdue { color: #bd5d48; }
    .task.completed .task-title { color: #9ba39c; text-decoration: line-through; text-decoration-color: #b9c1ba; }
    .task.completed .task-meta { opacity: .65; }
    .delete-button { display: grid; width: 32px; height: 32px; place-items: center; border: 0; border-radius: 5px; background: transparent; color: #9ba39c; cursor: pointer; opacity: .65; }
    .delete-button:hover { background: #fbefec; color: #b95745; opacity: 1; }
    .delete-button svg { width: 16px; height: 16px; }
    .empty { padding: 50px 20px; color: var(--muted); text-align: center; }
    .empty-mark { display: grid; width: 43px; height: 43px; margin: 0 auto 15px; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green); }
    .empty-mark svg { width: 20px; height: 20px; }
    .empty p { margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 19px; color: var(--ink); }
    .empty span { display: block; margin-top: 7px; font-size: 12px; }
    .footer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; color: var(--muted); font-size: 11px; }
    .storage-status { margin-left: auto; text-align: right; }
    .storage-status.error { color: #bd5d48; }
    .clear-button { padding: 5px 0; border: 0; background: transparent; color: #8a938d; font-size: 11px; cursor: pointer; }
    .clear-button:hover { color: var(--coral); }
    @media (max-width: 760px) {
      .shell { padding: 23px 20px; }
      .topbar { grid-template-columns: minmax(0, 1fr) auto; gap: 16px 12px; margin-bottom: 31px; }
      .nav { grid-column: 1 / -1; justify-content: flex-start; overflow-x: auto; padding-bottom: 3px; }
      .nav button { min-height: 38px; padding: 0 10px; font-size: 12px; }
      .nav-icon { display: none; }
      .heading-row { margin-bottom: 20px; }
      .composer { grid-template-columns: minmax(0, 1fr) auto; }
      .composer input[type="text"] { grid-column: 1 / -1; min-height: 36px; }
      .composer select, .composer input[type="date"] { min-width: 0; }
      .add-button { grid-column: 2; grid-row: 2; }
    }
    @media (max-width: 430px) {
      .shell { padding-inline: 15px; }
      .today-label { font-size: 11px; }
      .heading-row { align-items: flex-start; flex-direction: column; gap: 13px; }
      .progress { align-self: flex-end; margin-top: -3px; }
      .composer { grid-template-columns: minmax(0, 1fr) auto; }
      .composer select { grid-column: 1; }
      .composer input[type="date"] { grid-column: 1; grid-row: 3; }
      .add-button { grid-column: 2; grid-row: 2 / 4; align-self: stretch; padding-inline: 12px; }
      .task { grid-template-columns: 20px minmax(0, 1fr) 28px; gap: 10px; padding-inline: 12px; }
      .task-meta { flex-wrap: wrap; row-gap: 4px; }
      .task .due { grid-column: 2; }
      .delete-button { grid-column: 3; grid-row: 1; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></span>
        Daymark
      </div>
      <nav class="nav" id="filters" aria-label="Task views">
        <button class="active" type="button" data-filter="all" aria-pressed="true"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span>All tasks <span class="nav-count" data-count="all">0</span></button>
        <button type="button" data-filter="today" aria-pressed="false"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>Today <span class="nav-count" data-count="today">0</span></button>
        <button type="button" data-filter="upcoming" aria-pressed="false"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M8 7h8M8 11h6"/></svg></span>Upcoming <span class="nav-count" data-count="upcoming">0</span></button>
        <button type="button" data-filter="done" aria-pressed="false"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></span>Completed <span class="nav-count" data-count="done">0</span></button>
      </nav>
      <time class="today-label" id="today-label"></time>
    </header>
    <div class="layout">
      <main>
        <div class="heading-row">
          <div>
            <h1 id="view-title">All tasks</h1>
            <p class="subtitle" id="view-subtitle">A little progress adds up.</p>
          </div>
          <div class="progress" aria-label="Today's completion progress"><span id="progress-text">0 of 0 done</span><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div></div>
        </div>
        <form class="composer" id="task-form">
          <input id="task-input" type="text" placeholder="What needs doing?" maxlength="180" aria-label="New task" autocomplete="off" required>
          <select id="priority-input" aria-label="Task priority">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High priority</option>
          </select>
          <input id="due-input" type="date" aria-label="Due date">
          <button class="add-button" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
        </form>
        <div class="list-head"><h2 id="list-label">Your list</h2><span class="sort-label">Soonest first</span></div>
        <section class="task-list" id="task-list" aria-live="polite"></section>
        <div class="footer-row"><span id="remaining-count">Nothing on your list yet</span><span class="storage-status" id="storage-status" role="status" aria-live="polite">Saved on this device</span><button class="clear-button" id="clear-completed" type="button" hidden>Clear completed</button></div>
      </main>
    </div>
  </div>
  <script>
    const STORAGE_KEY = "daymark-tasks-v1";
    const today = new Date();
    const localDate = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    };
    const todayString = localDate(today);
    const dateLabel = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
    document.querySelector("#today-label").textContent = dateLabel.format(today);

    let tasks = [];
    const storageStatus = document.querySelector("#storage-status");
    try {
      const storedValue = localStorage.getItem(STORAGE_KEY);
      const stored = JSON.parse(storedValue || "[]");
      if (Array.isArray(stored)) tasks = stored.filter((task) => task && typeof task.id === "string" && typeof task.title === "string");
      else if (storedValue) storageStatus.textContent = "Saved list could not be read";
    } catch {
      storageStatus.textContent = "Browser storage is unavailable; tasks may not persist";
      storageStatus.classList.add("error");
    }
    let activeFilter = "all";

    const views = {
      all: ["All tasks", "A little progress adds up."],
      today: ["Today", "Make room for what matters today."],
      upcoming: ["Coming up", "Your next steps, at a glance."],
      done: ["Completed", "Look how far you’ve come."]
    };
    const priorityNames = { low: "Low", medium: "Medium", high: "High" };
    const list = document.querySelector("#task-list");
    const escapeText = (text) => {
      const node = document.createElement("span");
      node.textContent = text;
      return node.innerHTML;
    };
    const dateText = (value) => {
      if (value === todayString) return "Today";
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);
      if (value === localDate(tomorrow)) return "Tomorrow";
      const parsed = new Date(`${value}T12:00:00`);
      return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(parsed);
    };
    const isVisible = (task) => {
      if (activeFilter === "today") return !task.done && task.due === todayString;
      if (activeFilter === "upcoming") return !task.done && task.due && task.due > todayString;
      if (activeFilter === "done") return task.done;
      return true;
    };
    const persist = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        storageStatus.textContent = "Saved on this device";
        storageStatus.classList.remove("error");
      } catch {
        storageStatus.textContent = "Could not save; check browser storage settings";
        storageStatus.classList.add("error");
      }
    };

    function render() {
      const todayTasks = tasks.filter((task) => !task.done && task.due === todayString);
      const counts = {
        all: tasks.filter((task) => !task.done).length,
        today: todayTasks.length,
        upcoming: tasks.filter((task) => !task.done && task.due && task.due > todayString).length,
        done: tasks.filter((task) => task.done).length
      };
      document.querySelectorAll("[data-count]").forEach((node) => { node.textContent = counts[node.dataset.count]; });
      document.querySelector("#view-title").textContent = views[activeFilter][0];
      document.querySelector("#view-subtitle").textContent = views[activeFilter][1];
      document.querySelector("#list-label").textContent = activeFilter === "all" ? "Your list" : views[activeFilter][0];
      const completedToday = todayTasks.filter((task) => task.done).length;
      const doneCount = tasks.filter((task) => task.done && task.completedOn === todayString).length;
      const progressTotal = todayTasks.length + doneCount;
      const progressDone = doneCount;
      document.querySelector("#progress-text").textContent = `${progressDone} of ${progressTotal} done today`;
      document.querySelector("#progress-fill").style.width = `${progressTotal ? (progressDone / progressTotal) * 100 : 0}%`;
      const visible = tasks.filter(isVisible).sort((left, right) => {
        if (left.done !== right.done && activeFilter === "all") return left.done ? 1 : -1;
        if (left.due && right.due && left.due !== right.due) return left.due.localeCompare(right.due);
        if (left.due && !right.due) return -1;
        if (!left.due && right.due) return 1;
        return left.createdAt - right.createdAt;
      });
      if (!visible.length) {
        const emptyMessages = {
          all: ["A clear runway.", "Add a task above to get started."],
          today: ["Nothing due today.", "Enjoy the breathing room, or add a task."],
          upcoming: ["Nothing planned ahead.", "Add a due date to see it here."],
          done: ["No completed tasks yet.", "Finish a task and it will land here."]
        };
        list.innerHTML = `<div class="empty"><div class="empty-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div><p>${emptyMessages[activeFilter][0]}</p><span>${emptyMessages[activeFilter][1]}</span></div>`;
      } else {
        list.innerHTML = visible.map((task) => {
          const overdue = !task.done && task.due && task.due < todayString;
          const due = task.due ? `<span class="due${overdue ? " overdue" : ""}">${overdue ? "Overdue · " : "Due "}${dateText(task.due)}</span>` : "";
          return `<article class="task${task.done ? " completed" : ""}" data-id="${escapeText(task.id)}"><input class="check" type="checkbox" aria-label="Mark ${escapeText(task.title)} complete" ${task.done ? "checked" : ""}><div class="task-copy"><div class="task-title">${escapeText(task.title)}</div><div class="task-meta"><span class="priority ${escapeText(task.priority)}">${priorityNames[task.priority] || "Medium"}</span>${due}</div></div><button class="delete-button" type="button" aria-label="Delete ${escapeText(task.title)}" title="Delete task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m3 0-.9 14H5.9L5 6m4 4v6m6-6v6"/></svg></button></article>`;
        }).join("");
      }
      const remaining = counts.all;
      document.querySelector("#remaining-count").textContent = remaining ? `${remaining} task${remaining === 1 ? "" : "s"} left` : "Nothing on your list yet";
      document.querySelector("#clear-completed").hidden = counts.done === 0;
      document.querySelectorAll("#filters button").forEach((button) => {
        const selected = button.dataset.filter === activeFilter;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    }

    document.querySelector("#task-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.querySelector("#task-input");
      const title = input.value.trim();
      if (!title) { input.focus(); return; }
      tasks.push({ id: crypto.randomUUID(), title, priority: document.querySelector("#priority-input").value, due: document.querySelector("#due-input").value, done: false, createdAt: Date.now() });
      persist();
      event.currentTarget.reset();
      document.querySelector("#priority-input").value = "medium";
      input.focus();
      render();
    });
    document.querySelector("#filters").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-filter]");
      if (!button) return;
      activeFilter = button.dataset.filter;
      render();
    });
    list.addEventListener("change", (event) => {
      if (!event.target.matches(".check")) return;
      const task = tasks.find((item) => item.id === event.target.closest(".task").dataset.id);
      if (!task) return;
      task.done = event.target.checked;
      task.completedOn = task.done ? todayString : null;
      persist();
      render();
    });
    list.addEventListener("click", (event) => {
      const button = event.target.closest(".delete-button");
      if (!button) return;
      const id = button.closest(".task").dataset.id;
      tasks = tasks.filter((task) => task.id !== id);
      persist();
      render();
    });
    document.querySelector("#clear-completed").addEventListener("click", () => {
      tasks = tasks.filter((task) => !task.done);
      persist();
      render();
    });
    render();
  </script>
</body>
</html>
