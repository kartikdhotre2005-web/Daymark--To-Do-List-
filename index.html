<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <title>Daymark — To-do list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></span>
        Daymark
      </div>
      <nav class="nav" id="filters" aria-label="Task views">
        <button class="active" type="button" data-filter="all" aria-pressed="true"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span>All tasks <span class="nav-count" data-count="all">0</span></button>
        <button type="button" data-filter="today" aria-pressed="false"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>Today <span class="nav-count" data-count="today">0</span></button>
        <button type="button" data-filter="upcoming" aria-pressed="false"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M8 7h8M8 11h6"/></svg></span>Upcoming <span class="nav-count" data-count="upcoming">0</span></button>
        <button type="button" data-filter="done" aria-pressed="false"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></span>Completed <span class="nav-count" data-count="done">0</span></button>
      </nav>
      <time class="today-label" id="today-label"></time>
    </header>
    <div class="layout">
      <main>
        <div class="heading-row">
          <div>
            <h1 id="view-title">All tasks</h1>
            <p class="subtitle" id="view-subtitle">A little progress adds up.</p>
          </div>
          <div class="progress" aria-label="Today's completion progress"><span id="progress-text">0 of 0 done</span><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div></div>
        </div>
        <form class="composer" id="task-form">
          <input id="task-input" type="text" placeholder="What needs doing?" maxlength="180" aria-label="New task" autocomplete="off" required>
          <select id="priority-input" aria-label="Task priority">
            <option value="low">Low priority</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High priority</option>
          </select>
          <input id="due-input" type="date" aria-label="Due date">
          <button class="add-button" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
        </form>
        <div class="list-head"><h2 id="list-label">Your list</h2><span class="sort-label">Soonest first</span></div>
        <section class="task-list" id="task-list" aria-live="polite"></section>
        <div class="footer-row"><span id="remaining-count">Nothing on your list yet</span><span class="storage-status" id="storage-status" role="status" aria-live="polite">Saved on this device</span><button class="clear-button" id="clear-completed" type="button" hidden>Clear completed</button></div>
      </main>
    </div>
  </div>
  <script>
    const STORAGE_KEY = "daymark-tasks-v1";
    const today = new Date();
    const localDate = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    };
    const todayString = localDate(today);
    const dateLabel = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
    document.querySelector("#today-label").textContent = dateLabel.format(today);

    let tasks = [];
    const storageStatus = document.querySelector("#storage-status");
    try {
      const storedValue = localStorage.getItem(STORAGE_KEY);
      const stored = JSON.parse(storedValue || "[]");
      if (Array.isArray(stored)) tasks = stored.filter((task) => task && typeof task.id === "string" && typeof task.title === "string");
      else if (storedValue) storageStatus.textContent = "Saved list could not be read";
    } catch {
      storageStatus.textContent = "Browser storage is unavailable; tasks may not persist";
      storageStatus.classList.add("error");
    }
    let activeFilter = "all";

    const views = {
      all: ["All tasks", "A little progress adds up."],
      today: ["Today", "Make room for what matters today."],
      upcoming: ["Coming up", "Your next steps, at a glance."],
      done: ["Completed", "Look how far you’ve come."]
    };
    const priorityNames = { low: "Low", medium: "Medium", high: "High" };
    const list = document.querySelector("#task-list");
    const escapeText = (text) => {
      const node = document.createElement("span");
      node.textContent = text;
      return node.innerHTML;
    };
    const dateText = (value) => {
      if (value === todayString) return "Today";
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);
      if (value === localDate(tomorrow)) return "Tomorrow";
      const parsed = new Date(`${value}T12:00:00`);
      return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(parsed);
    };
    const isVisible = (task) => {
      if (activeFilter === "today") return !task.done && task.due === todayString;
      if (activeFilter === "upcoming") return !task.done && task.due && task.due > todayString;
      if (activeFilter === "done") return task.done;
      return true;
    };
    const persist = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        storageStatus.textContent = "Saved on this device";
        storageStatus.classList.remove("error");
      } catch {
        storageStatus.textContent = "Could not save; check browser storage settings";
        storageStatus.classList.add("error");
      }
    };

    function render() {
      const todayTasks = tasks.filter((task) => !task.done && task.due === todayString);
      const counts = {
        all: tasks.filter((task) => !task.done).length,
        today: todayTasks.length,
        upcoming: tasks.filter((task) => !task.done && task.due && task.due > todayString).length,
        done: tasks.filter((task) => task.done).length
      };
      document.querySelectorAll("[data-count]").forEach((node) => { node.textContent = counts[node.dataset.count]; });
      document.querySelector("#view-title").textContent = views[activeFilter][0];
      document.querySelector("#view-subtitle").textContent = views[activeFilter][1];
      document.querySelector("#list-label").textContent = activeFilter === "all" ? "Your list" : views[activeFilter][0];
      const completedToday = todayTasks.filter((task) => task.done).length;
      const doneCount = tasks.filter((task) => task.done && task.completedOn === todayString).length;
      const progressTotal = todayTasks.length + doneCount;
      const progressDone = doneCount;
      document.querySelector("#progress-text").textContent = `${progressDone} of ${progressTotal} done today`;
      document.querySelector("#progress-fill").style.width = `${progressTotal ? (progressDone / progressTotal) * 100 : 0}%`;
      const visible = tasks.filter(isVisible).sort((left, right) => {
        if (left.done !== right.done && activeFilter === "all") return left.done ? 1 : -1;
        if (left.due && right.due && left.due !== right.due) return left.due.localeCompare(right.due);
        if (left.due && !right.due) return -1;
        if (!left.due && right.due) return 1;
        return left.createdAt - right.createdAt;
      });
      if (!visible.length) {
        const emptyMessages = {
          all: ["A clear runway.", "Add a task above to get started."],
          today: ["Nothing due today.", "Enjoy the breathing room, or add a task."],
          upcoming: ["Nothing planned ahead.", "Add a due date to see it here."],
          done: ["No completed tasks yet.", "Finish a task and it will land here."]
        };
        list.innerHTML = `<div class="empty"><div class="empty-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div><p>${emptyMessages[activeFilter][0]}</p><span>${emptyMessages[activeFilter][1]}</span></div>`;
      } else {
        list.innerHTML = visible.map((task) => {
          const overdue = !task.done && task.due && task.due < todayString;
          const due = task.due ? `<span class="due${overdue ? " overdue" : ""}">${overdue ? "Overdue · " : "Due "}${dateText(task.due)}</span>` : "";
          return `<article class="task${task.done ? " completed" : ""}" data-id="${escapeText(task.id)}"><input class="check" type="checkbox" aria-label="Mark ${escapeText(task.title)} complete" ${task.done ? "checked" : ""}><div class="task-copy"><div class="task-title">${escapeText(task.title)}</div><div class="task-meta"><span class="priority ${escapeText(task.priority)}">${priorityNames[task.priority] || "Medium"}</span>${due}</div></div><button class="delete-button" type="button" aria-label="Delete ${escapeText(task.title)}" title="Delete task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m3 0-.9 14H5.9L5 6m4 4v6m6-6v6"/></svg></button></article>`;
        }).join("");
      }
      const remaining = counts.all;
      document.querySelector("#remaining-count").textContent = remaining ? `${remaining} task${remaining === 1 ? "" : "s"} left` : "Nothing on your list yet";
      document.querySelector("#clear-completed").hidden = counts.done === 0;
      document.querySelectorAll("#filters button").forEach((button) => {
        const selected = button.dataset.filter === activeFilter;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
    }

    document.querySelector("#task-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.querySelector("#task-input");
      const title = input.value.trim();
      if (!title) { input.focus(); return; }
      tasks.push({ id: crypto.randomUUID(), title, priority: document.querySelector("#priority-input").value, due: document.querySelector("#due-input").value, done: false, createdAt: Date.now() });
      persist();
      event.currentTarget.reset();
      document.querySelector("#priority-input").value = "medium";
      input.focus();
      render();
    });
    document.querySelector("#filters").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-filter]");
      if (!button) return;
      activeFilter = button.dataset.filter;
      render();
    });
    list.addEventListener("change", (event) => {
      if (!event.target.matches(".check")) return;
      const task = tasks.find((item) => item.id === event.target.closest(".task").dataset.id);
      if (!task) return;
      task.done = event.target.checked;
      task.completedOn = task.done ? todayString : null;
      persist();
      render();
    });
    list.addEventListener("click", (event) => {
      const button = event.target.closest(".delete-button");
      if (!button) return;
      const id = button.closest(".task").dataset.id;
      tasks = tasks.filter((task) => task.id !== id);
      persist();
      render();
    });
    document.querySelector("#clear-completed").addEventListener("click", () => {
      tasks = tasks.filter((task) => !task.done);
      persist();
      render();
    });
    render();
  </script>
</body>
</html>
